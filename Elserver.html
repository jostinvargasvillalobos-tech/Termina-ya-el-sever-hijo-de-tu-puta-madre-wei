<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termina el server hp gorda </title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* Video de fondo cubriendo toda la pantalla */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        h1 {
            font-size: 70px;
            position: relative;
            z-index: 1;
            /* Sombra al texto para que sea legible sobre cualquier video */
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>

<body>

    <!-- Video de fondo (cambia 'video.mp4' por el nombre de tu archivo) -->
    <video class="video-background" autoplay loop muted playsinline>
        <source src="https://www.youtube.com/shorts/yExBasr4qoE?feature=share" type="video/mp4">
        Tu navegador no soporta videos HTML5.
    </video>

    <h1>TERMINEN EL SERVER PUTA MADRE </h1>

</body>
</html>

</html>
